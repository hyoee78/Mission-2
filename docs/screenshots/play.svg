<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1752" viewBox="0 0 1280 1752">
<rect width="1280" height="1752" rx="18" fill="#111827"/><rect width="1280" height="42" rx="18" fill="#1f2937"/>
<circle cx="22" cy="21" r="6" fill="#f87171"/><circle cx="43" cy="21" r="6" fill="#fbbf24"/><circle cx="64" cy="21" r="6" fill="#34d399"/>
<text x="90" y="27" class="title">Quiz play and hint — captured console output</text>
<style>.title{font:600 16px -apple-system,BlinkMacSystemFont,sans-serif;fill:#e5e7eb}.line{font:15px Menlo,Monaco,monospace;fill:#d1fae5}</style>
<text x="28" y="68" class="line">찰리와 초콜릿 공장 이야기 퀴즈</text><text x="28" y="90" class="line"></text><text x="28" y="112" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="134" class="line">메뉴 선택 (1-6): 3</text><text x="28" y="156" class="line"></text><text x="28" y="178" class="line">등록된 퀴즈: 5개</text><text x="28" y="200" class="line">1. 찰리가 찾은 마지막 황금 티켓은 무엇을 위한 초대장이었나요?</text><text x="28" y="222" class="line">2. 찰리와 함께 공장을 둘러본 가족은 누구인가요?</text><text x="28" y="244" class="line">3. 바이올렛 뷰리가드가 실험용 껌을 씹은 뒤 어떤 모습으로 변했나요?</text><text x="28" y="266" class="line">4. 버루카 솔트가 다람쥐들에게 다가간 뒤 벌어진 일은 무엇인가요?</text><text x="28" y="288" class="line">5. 마이크 티비가 공장에서 작아진 계기는 무엇인가요?</text><text x="28" y="310" class="line"></text><text x="28" y="332" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="354" class="line">메뉴 선택 (1-6): 4</text><text x="28" y="376" class="line">아직 기록된 점수가 없습니다. 퀴즈에 도전해 보세요!</text><text x="28" y="398" class="line">플레이 횟수: 0회</text><text x="28" y="420" class="line"></text><text x="28" y="442" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="464" class="line">메뉴 선택 (1-6): 1</text><text x="28" y="486" class="line"></text><text x="28" y="508" class="line">퀴즈를 시작합니다! 총 5문제입니다.</text><text x="28" y="530" class="line"></text><text x="28" y="552" class="line">[문제 1] 찰리가 찾은 마지막 황금 티켓은 무엇을 위한 초대장이었나요?</text><text x="28" y="574" class="line">1. 초콜릿 공장 견학</text><text x="28" y="596" class="line">2. 새 학교 입학</text><text x="28" y="618" class="line">3. 사탕 가게 개업식</text><text x="28" y="640" class="line">4. 배 여행</text><text x="28" y="662" class="line">정답 번호 (1-4, 힌트는 h): h</text><text x="28" y="684" class="line">힌트: 초대장을 받은 아이들은 신비한 공장 안으로 들어갑니다.</text><text x="28" y="706" class="line">정답 번호 (1-4, 힌트는 h): 1</text><text x="28" y="728" class="line">정답입니다!</text><text x="28" y="750" class="line"></text><text x="28" y="772" class="line">[문제 2] 찰리와 함께 공장을 둘러본 가족은 누구인가요?</text><text x="28" y="794" class="line">1. 엄마</text><text x="28" y="816" class="line">2. 조지 할아버지</text><text x="28" y="838" class="line">3. 조 할아버지</text><text x="28" y="860" class="line">4. 아버지</text><text x="28" y="882" class="line">정답 번호 (1-4, 힌트는 h): 3</text><text x="28" y="904" class="line">정답입니다!</text><text x="28" y="926" class="line"></text><text x="28" y="948" class="line">[문제 3] 바이올렛 뷰리가드가 실험용 껌을 씹은 뒤 어떤 모습으로 변했나요?</text><text x="28" y="970" class="line">1. 풍선처럼 부풀었다</text><text x="28" y="992" class="line">2. 블루베리처럼 변했다</text><text x="28" y="1014" class="line">3. 투명해졌다</text><text x="28" y="1036" class="line">4. 목소리가 사라졌다</text><text x="28" y="1058" class="line">정답 번호 (1-4, 힌트는 h): 2</text><text x="28" y="1080" class="line">정답입니다!</text><text x="28" y="1102" class="line"></text><text x="28" y="1124" class="line">[문제 4] 버루카 솔트가 다람쥐들에게 다가간 뒤 벌어진 일은 무엇인가요?</text><text x="28" y="1146" class="line">1. 다람쥐들이 춤을 췄다</text><text x="28" y="1168" class="line">2. 버루카가 견과류 판정을 받았다</text><text x="28" y="1190" class="line">3. 다람쥐들이 공장을 떠났다</text><text x="28" y="1212" class="line">4. 찰리가 티켓을 잃었다</text><text x="28" y="1234" class="line">정답 번호 (1-4, 힌트는 h): 2</text><text x="28" y="1256" class="line">정답입니다!</text><text x="28" y="1278" class="line"></text><text x="28" y="1300" class="line">[문제 5] 마이크 티비가 공장에서 작아진 계기는 무엇인가요?</text><text x="28" y="1322" class="line">1. 텔레비전 전송 장치를 이용했다</text><text x="28" y="1344" class="line">2. 초콜릿 강에 빠졌다</text><text x="28" y="1366" class="line">3. 껌을 씹었다</text><text x="28" y="1388" class="line">4. 유리 엘리베이터를 탔다</text><text x="28" y="1410" class="line">정답 번호 (1-4, 힌트는 h): 1</text><text x="28" y="1432" class="line">정답입니다!</text><text x="28" y="1454" class="line"></text><text x="28" y="1476" class="line">결과: 5문제 중 5문제 정답 (100점)</text><text x="28" y="1498" class="line">새로운 최고 점수입니다!</text><text x="28" y="1520" class="line"></text><text x="28" y="1542" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="1564" class="line">메뉴 선택 (1-6): 4</text><text x="28" y="1586" class="line">최고 점수: 5문제 정답</text><text x="28" y="1608" class="line">플레이 횟수: 1회</text><text x="28" y="1630" class="line">최근 점수: 5문제 정답</text><text x="28" y="1652" class="line"></text><text x="28" y="1674" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="1696" class="line">메뉴 선택 (1-6): 6</text><text x="28" y="1718" class="line">게임을 종료합니다. 다음에 또 만나요!</text></svg>