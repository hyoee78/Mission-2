<circle cx="22" cy="21" r="6" fill="#f87171"/><circle cx="43" cy="21" r="6" fill="#fbbf24"/><circle cx="64" cy="21" r="6" fill="#34d399"/>
<text x="90" y="27" class="title">Add a quiz, list, and score — captured command output</text>
<style>.title{font:600 16px -apple-system,BlinkMacSystemFont,sans-serif;fill:#e5e7eb}.line{font:15px Menlo,Monaco,monospace;fill:#d1fae5}</style>
<text x="28" y="68" class="line">찰리와 초콜릿 공장 이야기 퀴즈</text><text x="28" y="90" class="line"></text><text x="28" y="112" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="134" class="line">메뉴 선택 (1-6): 2</text><text x="28" y="156" class="line"></text><text x="28" y="178" class="line">새 퀴즈를 등록합니다.</text><text x="28" y="200" class="line">문제: 초콜릿 공장의 주인은 누구인가요?</text><text x="28" y="222" class="line">선택지 1: 윌리 웡카</text><text x="28" y="244" class="line">선택지 2: 찰리</text><text x="28" y="266" class="line">선택지 3: 조 할아버지</text><text x="28" y="288" class="line">선택지 4: 바이올렛</text><text x="28" y="310" class="line">정답 번호 (1-4): 1</text><text x="28" y="332" class="line">힌트 (없으면 Enter): 모자와 지팡이를 든 발명가입니다.</text><text x="28" y="354" class="line">퀴즈를 저장했습니다.</text><text x="28" y="376" class="line"></text><text x="28" y="398" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="420" class="line">메뉴 선택 (1-6): 3</text><text x="28" y="442" class="line"></text><text x="28" y="464" class="line">등록된 퀴즈: 6개</text><text x="28" y="486" class="line">1. 찰리가 찾은 마지막 황금 티켓은 무엇을 위한 초대장이었나요?</text><text x="28" y="508" class="line">2. 찰리와 함께 공장을 둘러본 가족은 누구인가요?</text><text x="28" y="530" class="line">3. 바이올렛 뷰리가드가 실험용 껌을 씹은 뒤 어떤 모습으로 변했나요?</text><text x="28" y="552" class="line">4. 버루카 솔트가 다람쥐들에게 다가간 뒤 벌어진 일은 무엇인가요?</text><text x="28" y="574" class="line">5. 마이크 티비가 공장에서 작아진 계기는 무엇인가요?</text><text x="28" y="596" class="line">6. 초콜릿 공장의 주인은 누구인가요?</text><text x="28" y="618" class="line"></text><text x="28" y="640" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="662" class="line">메뉴 선택 (1-6): 4</text><text x="28" y="684" class="line">아직 기록된 점수가 없습니다. 퀴즈에 도전해 보세요!</text><text x="28" y="706" class="line">플레이 횟수: 0회</text><text x="28" y="728" class="line"></text><text x="28" y="750" class="line">1. 퀴즈 풀기  2. 퀴즈 추가  3. 퀴즈 목록  4. 점수 보기  5. 퀴즈 삭제  6. 종료</text><text x="28" y="772" class="line">메뉴 선택 (1-6): 6</text><text x="28" y="794" class="line">게임을 종료합니다. 다음에 또 만나요!</text></svg>